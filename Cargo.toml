[workspace]
resolver = "2"
members = [
    "common/pessimal_core",
    "agents/common/pessimal_agent_core",
    "agents/host/pessimal_agent_host",
    "clients/common/pessimal_client_core",
    "clients/common/query/pessimal_query_signoz",
    "clients/ffi/pessimal_ffi",
    "tools/uniffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/pessimal/pessimal"
authors = ["Pessimal contributors"]

[workspace.dependencies]
pessimal_core = { path = "common/pessimal_core" }
pessimal_agent_core = { path = "agents/common/pessimal_agent_core" }
pessimal_client_core = { path = "clients/common/pessimal_client_core" }
pessimal_query_signoz = { path = "clients/common/query/pessimal_query_signoz" }

# Core
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
async-trait = "0.1"
futures = "0.3"

# HTTP client (query adapters)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

# Host metric collection
sysinfo = "0.33"
hostname = "0.4"

# OpenTelemetry
opentelemetry = { version = "0.27", features = ["metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["metrics", "grpc-tonic", "http-proto", "reqwest-client", "reqwest-rustls"] }
opentelemetry-semantic-conventions = "0.27"

# FFI
uniffi = "0.31"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Testing
tokio-test = "0.4"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
