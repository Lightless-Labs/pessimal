[workspace]
resolver = "2"
members = [
    "common/pessimal_core",
    "common/pessimal_usage",
    "common/pessimal_usage_otlp",
    "agents/common/pessimal_agent_core",
    "agents/host/pessimal_agent_host",
    "clients/common/pessimal_client_core",
    "clients/common/query/pessimal_query_signoz",
    "clients/ffi/pessimal_ffi",
    "tools/uniffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/pessimal/pessimal"
authors = ["Pessimal contributors"]

[workspace.dependencies]
pessimal_core = { path = "common/pessimal_core" }
pessimal_usage = { path = "common/pessimal_usage" }
pessimal_usage_otlp = { path = "common/pessimal_usage_otlp" }
pessimal_agent_core = { path = "agents/common/pessimal_agent_core" }
pessimal_client_core = { path = "clients/common/pessimal_client_core" }
pessimal_query_signoz = { path = "clients/common/query/pessimal_query_signoz" }
pessimal_ffi = { path = "clients/ffi/pessimal_ffi" }
pessimal_agent_host = { path = "agents/host/pessimal_agent_host" }

# Core
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
async-trait = "0.1"
futures = "0.3"

# HTTP client
#
# Deliberately not a workspace dependency. Every crate that needs reqwest — the query adapter, the
# FFI bridge, the usage exporter — declares 0.13 itself with `rustls-no-provider`, because the TLS
# feature choice is the whole argument and it differs by where the crate is linked. A workspace
# default here was dead: nothing referenced it, while `opentelemetry-otlp` 0.32 already pulls 0.13.
url = "2"

# Host metric collection
sysinfo = "0.39"
hostname = "0.4"

# OpenTelemetry
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["metrics", "grpc-tonic", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "tls-ring", "tls-roots", "internal-logs"] }
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }

# FFI
uniffi = "0.32"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Testing
tokio-test = "0.4"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
