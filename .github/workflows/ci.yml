name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ==========================================================================
  # Conventional commits (PRs only)
  # ==========================================================================
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a  # v4.2.0
        with:
          command: check
          args: --from-latest-tag

  # ==========================================================================
  # Format and lint once, on the cheapest runner
  # ==========================================================================
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ==========================================================================
  # The agent targets Linux, macOS and Windows, so it is built and tested on
  # all three. Hosted runners only: this is a public repo, and a fork's PR must
  # never reach the self-hosted machine.
  # ==========================================================================
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: ${{ matrix.os }}

      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

      # The host collector is the part most likely to differ per platform, so
      # prove the binary can actually read this runner's host.
      - name: Sample the runner's host
        run: cargo run -p pessimal_agent_host -- --config pessimal.example.toml --sample

  # ==========================================================================
  # End-to-end: does the agent's OTLP actually reach a collector? Both
  # protocols, because they fail in different ways.
  # ==========================================================================
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      otelcol:
        image: otel/opentelemetry-collector-contrib:0.160.0
        ports:
          - 4317:4317
          - 4318:4318
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - run: cargo build -p pessimal_agent_host

      # The service container runs the image's default config, which accepts
      # OTLP on both ports and exports nothing. Reaching it at all is the
      # assertion: a 404 on the HTTP path or a missing gRPC runtime both show
      # up here as a non-empty error log.
      - name: Export over gRPC
        run: ./scripts/ci-export-smoke.sh grpc http://localhost:4317

      - name: Export over HTTP/protobuf
        run: ./scripts/ci-export-smoke.sh http/protobuf http://localhost:4318

  # ==========================================================================
  # The generated Swift bindings are build outputs that are committed, so they
  # can go stale silently: a stale .swift means a Rust signature change has no
  # effect, because the iOS build compiles the committed file rather than the
  # code. Regenerate and diff, so a forgotten `./tools/uniffi/regen.sh` fails
  # here rather than at someone's next Xcode build.
  #
  # Also runs the Swift smoke test, which is the only check that drives the FFI
  # boundary from Swift's own executor -- the thing no Rust test can do.
  # macOS-only, hence its own job.
  # ==========================================================================
  bindings:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: bindings

      - name: Regenerate the Swift bindings
        run: ./tools/uniffi/regen.sh

      - name: Fail if the committed bindings are stale
        run: |
          if ! git diff --exit-code -- clients/apple/PessimalFFI/Sources; then
            echo "::error::the committed Swift bindings do not match the Rust source."
            echo "Run ./tools/uniffi/regen.sh and commit both generated files together."
            exit 1
          fi

      - name: Drive the FFI boundary from Swift
        run: ./scripts/swift-smoke.sh

      # The app is assembled by a script rather than an Xcode project, so nothing else would
      # notice it stopped compiling. Building the bundle here is what keeps the Swift honest
      # against a changing FFI surface -- a Rust signature change that breaks a view would
      # otherwise only surface the next time somebody built it by hand.
      - name: Build the macOS app bundle
        run: ./scripts/build-macos-app.sh

      - name: The bundle must be a real, self-contained UI-element app
        run: |
          APP=.build/macos/Pessimal.app
          BIN="$APP/Contents/MacOS/Pessimal"
          test -x "$BIN" || { echo "::error::no executable in the bundle"; exit 1; }
          # Linking the dylib instead of the archive produces an app that runs only on the
          # machine that built it, and only until the next cargo clean.
          if otool -L "$BIN" | grep -q pessimal_ffi; then
            echo "::error::the app links libpessimal_ffi dynamically; it must link the archive"
            otool -L "$BIN"
            exit 1
          fi
          if grep -q __PESSIMAL_ "$APP/Contents/Info.plist"; then
            echo "::error::Info.plist still contains unsubstituted placeholders"
            exit 1
          fi
          plutil -lint "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$APP/Contents/Info.plist" | grep -qx true \
            || { echo "::error::LSUIElement is not set; this would show a Dock icon"; exit 1; }
