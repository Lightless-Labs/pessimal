name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ==========================================================================
  # Conventional commits (PRs only)
  # ==========================================================================
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a  # v4.2.0
        with:
          command: check
          args: --from-latest-tag

  # ==========================================================================
  # Format and lint once, on the cheapest runner
  # ==========================================================================
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ==========================================================================
  # The agent targets Linux, macOS and Windows, so it is built and tested on
  # all three. Hosted runners only: this is a public repo, and a fork's PR must
  # never reach the self-hosted machine.
  # ==========================================================================
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: ${{ matrix.os }}

      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

      # The host collector is the part most likely to differ per platform, so
      # prove the binary can actually read this runner's host.
      - name: Sample the runner's host
        run: cargo run -p pessimal_agent_host -- --config pessimal.example.toml --sample

  # ==========================================================================
  # End-to-end: does the agent's OTLP actually reach a collector? Both
  # protocols, because they fail in different ways.
  # ==========================================================================
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      otelcol:
        image: otel/opentelemetry-collector-contrib:0.160.0
        ports:
          - 4317:4317
          - 4318:4318
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - run: cargo build -p pessimal_agent_host

      # The service container runs the image's default config, which accepts
      # OTLP on both ports and exports nothing. Reaching it at all is the
      # assertion: a 404 on the HTTP path or a missing gRPC runtime both show
      # up here as a non-empty error log.
      - name: Export over gRPC
        run: ./scripts/ci-export-smoke.sh grpc http://localhost:4317

      - name: Export over HTTP/protobuf
        run: ./scripts/ci-export-smoke.sh http/protobuf http://localhost:4318
