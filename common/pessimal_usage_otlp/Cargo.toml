[package]
name = "pessimal_usage_otlp"
description = "Ships Pessimal's usage spans to an OTLP/HTTP endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pessimal_usage = { workspace = true }
serde_json = { workspace = true }

# The same choice, for the same reasons, as pessimal_query_signoz: this crate is linked into the iOS
# client, so it must not pull aws-lc-rs. See that manifest for the full argument.
#
# Unlike the query adapter, this crate is also linked into the *agent*, whose graph enables both
# `ring` and `aws-lc-rs` — so `lib.rs` installs the provider explicitly rather than relying on
# crate features resolving. Without that, rustls panics rather than choosing.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[dev-dependencies]
chrono = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
