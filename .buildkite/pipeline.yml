# Pessimal's CI and its releases, on the self-hosted Apple silicon mini, through Tart guests.
#
# The shape is Descartes' (lightless-labs/public/descartes/.buildkite/pipeline.yml), because it is the
# one verified on this cluster: the same pinned tart-ci plugin, the same two images, the same
# concurrency groups, and the same rsync-into-the-guest checkout. The reasoning behind each of those
# is recorded in the band's cookbook,
# docs/solutions/ci-cd-patterns/2026-09-10-buildkite-self-hosted-ios-cicd-cookbook.md.
#
# This file is the whole of the project's automation; nothing else builds, tests or releases it. Every
# step's `if:` says which of three kinds of build it belongs to:
#
#   * A push or a pull request (`build.tag == null`) is verified: the Rust workspace on Linux, the OTLP
#     export against a real collector, the iOS app, and the macOS menu bar app with its bindings and
#     bundle checks. Linux and macOS on Apple silicon are what this cluster can run, so they are what
#     is tested. Windows is not tested anywhere.
#   * A push to main that passes verification ships to TestFlight. There is no tag to cut and no
#     button to press, which is the point -- a release that needs a human to remember it is a release
#     that drifts behind main. `[skip release]` in the commit message opts a push out.
#   * A `vMAJOR.MINOR.PATCH` tag releases the host agent and the menu bar app, and does nothing else.
#     That chain is the last section of this file.
#
# Pull requests from forks get no CI at all, and that is deliberate. The pipeline's setting to build
# pull requests from forked repositories (`build_pull_request_forks`) is off and must stay off: the
# repository is public, and a stranger's code must never execute on a self-hosted machine that holds
# signing credentials.

steps:
  - label: ":linux: Rust workspace"
    key: rust-linux
    if: build.tag == null
    retry:
      automatic:
        # A fresh Tart guest fetches every external archive, so an upstream 500 is routine.
        # Exit 1 covers the Bazel fetch failure; the rest are the guest dying under us.
        - exit_status: 1
          limit: 2
        - exit_status: -1  # agent lost, VM never came up
          limit: 2
        - exit_status: 255
          limit: 2
    # Linux guests are cheap and do not count against the macOS guest limit, so the Rust workspace
    # runs here and leaves the single macOS slot for Bazel and the Apple bundles.
    concurrency: 2
    concurrency_group: "big-cabbage/tart-ci-linux"
    agents:
      queue: "ci-linux-arm64"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-linux-arm64-rust-bazel"
          os: "linux"
          always_pull: false
          headless: true
          # Only what is listed reaches the guest. Buildkite documents BUILDKITE_PULL_REQUEST as set on
          # every build, to "false" when it is not a pull request; were it ever unset on the host, tart-ci
          # fails the step before the command runs, which is loud rather than a skipped check.
          env:
            - BUILDKITE_PULL_REQUEST
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" || "$$HOME" == "/" ]]; then
        export HOME=/home/admin
      fi

      # Conventional commits, on pull requests only: a push to main has no pull-request range to check.
      # It runs here, in the shared checkout and before the rsync below, because it reads history and
      # that rsync excludes .git. The gate lives in this command rather than in the script, so it is
      # visible where it is decided, and `:?` makes a variable missing from the allowlist fail the step
      # instead of quietly skipping the check.
      if [[ "$${BUILDKITE_PULL_REQUEST:?not forwarded to the guest; add it to the tart-ci env allowlist}" != "false" ]]; then
        scripts/ci-check-commits.sh
      fi

      # Out of the shared mount before building. Cargo and Bazel both write heavily, and the mount is
      # the one resource every concurrent guest shares.
      work_dir="$$HOME/pessimal-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$(pwd)/" "$$work_dir/"
      cd "$$work_dir"

      # The guest images' default toolchain drifts behind this workspace's MSRV: the macOS image ships
      # rustc 1.88 and sysinfo requires 1.95. Bazel never notices, because MODULE.bazel pins its own
      # 1.95.0 toolchain, so only the cargo-driven steps see it -- which is why the iOS job passed
      # while the macOS bundle failed with a list of crates demanding 1.95.
      #
      # Gated on the measured version rather than installed unconditionally. The Linux guest's rustup
      # lives in a root-owned /opt/rustup that the job user cannot write to, so an unconditional
      # install fails there with EACCES -- and that image already ships a new enough toolchain, so the
      # gate means it is never attempted. `stable` rather than a pinned version: the workspace tracks
      # stable on purpose, and a pin here would quietly stop CI testing the compiler contributors build
      # with.
      msrv="1.95"
      have="$$(cargo -V | awk '{print $$2}')"
      echo "cargo reports $$have; MSRV is $$msrv"
      if [[ "$$(printf '%s\n%s\n' "$$msrv" "$$have" | sort -V | head -1)" != "$$msrv" ]]; then
        echo "the guest toolchain is behind MSRV; installing stable"
        if [[ ! -w "$${RUSTUP_HOME:-$$HOME/.rustup}" ]]; then
          export RUSTUP_HOME="$$HOME/.rustup-ci"
        fi
        rustup toolchain install stable --profile minimal --component rustfmt,clippy
        rustup default stable
        cargo -V
      fi
      cargo --version
      cargo fmt --all --check
      cargo clippy --workspace --all-targets -- -D warnings
      cargo test --workspace --locked

      # The host collector is the part most likely to differ per platform, so prove the agent can read
      # this guest's host rather than only compile for it.
      cargo run -p pessimal_agent_host -- --config pessimal.example.toml --sample

  - label: ":satellite: OTLP export smoke"
    key: otlp-export-smoke
    if: build.tag == null
    retry:
      automatic:
        # A fresh Tart guest fetches every external archive -- crates and the collector alike -- so an
        # upstream 500 is routine. A real export failure also exits 1 and fails every attempt the same
        # way; the rest are the guest dying under us.
        - exit_status: 1
          limit: 2
        - exit_status: -1  # agent lost, VM never came up
          limit: 2
        - exit_status: 255
          limit: 2
    concurrency: 2
    concurrency_group: "big-cabbage/tart-ci-linux"
    agents:
      queue: "ci-linux-arm64"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-linux-arm64-rust-bazel"
          os: "linux"
          always_pull: false
          headless: true
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" || "$$HOME" == "/" ]]; then
        export HOME=/home/admin
      fi

      work_dir="$$HOME/pessimal-smoke-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$(pwd)/" "$$work_dir/"
      cd "$$work_dir"

      # The same MSRV gate as the Rust workspace step, for the same reasons; its comment has them.
      msrv="1.95"
      have="$$(cargo -V | awk '{print $$2}')"
      echo "cargo reports $$have; MSRV is $$msrv"
      if [[ "$$(printf '%s\n%s\n' "$$msrv" "$$have" | sort -V | head -1)" != "$$msrv" ]]; then
        echo "the guest toolchain is behind MSRV; installing stable"
        if [[ ! -w "$${RUSTUP_HOME:-$$HOME/.rustup}" ]]; then
          export RUSTUP_HOME="$$HOME/.rustup-ci"
        fi
        rustup toolchain install stable --profile minimal
        rustup default stable
        cargo -V
      fi

      # The smoke script needs the debug agent and deliberately does not build it. It fetches a pinned,
      # hash-checked otelcol-contrib (the guests cannot run Docker), exports to it over gRPC and over
      # HTTP/protobuf, and stops the collector on every exit path.
      cargo build -p pessimal_agent_host
      scripts/ci-otlp-export-smoke.sh

  - label: ":bazel: iOS app"
    key: ios-simulator
    if: build.tag == null
    retry:
      automatic:
        # A fresh Tart guest fetches every external archive, so an upstream 500 is routine.
        # Exit 1 covers the Bazel fetch failure; the rest are the guest dying under us.
        - exit_status: 1
          limit: 2
        - exit_status: -1  # agent lost, VM never came up
          limit: 2
        - exit_status: 255
          limit: 2
    # Exactly ONE macOS guest at a time, shared with every other macOS job. Two concurrent macOS VMs
    # starve each other on this host; Descartes' pipeline records the build numbers where that was
    # diagnosed. Do not raise this to get a faster pipeline.
    concurrency: 1
    concurrency_group: "big-cabbage/tart-ci-macos"
    agents:
      queue: "ci-macos-apple-silicon"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-macos-rust-bazel-ios-20260910-v2"
          os: "macos"
          always_pull: false
          headless: true
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" ]]; then
        export HOME=/Users/admin
      fi

      # Bazel on the shared mount fails on hardlinks. rsync sidesteps it by not making any.
      work_dir="$$HOME/pessimal-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$(pwd)/" "$$work_dir/"
      cd "$$work_dir"

      bazelisk build --config=ci //clients/apple/ios:Pessimal

      # A Swift app that compiled but never linked the Rust would still produce a runnable bundle and
      # fail at the first poll, so the symbols are the assertion, not the exit status.
      ipa=".bazel/bin/clients/apple/ios/Pessimal.ipa"
      test -f "$$ipa" || { echo "no ipa produced" >&2; exit 1; }
      unpack="$$(mktemp -d)"
      unzip -q "$$ipa" -d "$$unpack"
      bin="$$unpack/Payload/Pessimal.app/Pessimal"
      test -x "$$bin" || { echo "no executable in the bundle" >&2; exit 1; }
      symbols="$$(nm -gU "$$bin" | grep -c uniffi_pessimal_ffi || true)"
      echo "uniffi scaffolding symbols: $$symbols"
      if [[ "$$symbols" -lt 1 ]]; then
        echo "the iOS binary carries no uniffi symbols; the Rust core is not linked" >&2
        exit 1
      fi

  - label: ":apple: macOS menu bar app"
    key: macos-bundle
    if: build.tag == null
    retry:
      automatic:
        # A fresh Tart guest fetches every external archive, so an upstream 500 is routine.
        # Exit 1 covers the Bazel fetch failure; the rest are the guest dying under us.
        - exit_status: 1
          limit: 2
        - exit_status: -1  # agent lost, VM never came up
          limit: 2
        - exit_status: 255
          limit: 2
    depends_on: ios-simulator
    concurrency: 1
    concurrency_group: "big-cabbage/tart-ci-macos"
    agents:
      queue: "ci-macos-apple-silicon"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-macos-rust-bazel-ios-20260910-v2"
          os: "macos"
          always_pull: false
          headless: true
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" ]]; then
        export HOME=/Users/admin
      fi

      work_dir="$$HOME/pessimal-macos-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$(pwd)/" "$$work_dir/"
      cd "$$work_dir"

      # The guest images' default toolchain drifts behind this workspace's MSRV: the macOS image ships
      # rustc 1.88 and sysinfo requires 1.95. Bazel never notices, because MODULE.bazel pins its own
      # 1.95.0 toolchain, so only the cargo-driven steps see it -- which is why the iOS job passed
      # while the macOS bundle failed with a list of crates demanding 1.95.
      #
      # Gated on the measured version rather than installed unconditionally. The Linux guest's rustup
      # lives in a root-owned /opt/rustup that the job user cannot write to, so an unconditional
      # install fails there with EACCES -- and that image already ships a new enough toolchain, so the
      # gate means it is never attempted. `stable` rather than a pinned version: the workspace tracks
      # stable on purpose, and a pin here would quietly stop CI testing the compiler contributors build
      # with.
      msrv="1.95"
      have="$$(cargo -V | awk '{print $$2}')"
      echo "cargo reports $$have; MSRV is $$msrv"
      if [[ "$$(printf '%s\n%s\n' "$$msrv" "$$have" | sort -V | head -1)" != "$$msrv" ]]; then
        echo "the guest toolchain is behind MSRV; installing stable"
        if [[ ! -w "$${RUSTUP_HOME:-$$HOME/.rustup}" ]]; then
          export RUSTUP_HOME="$$HOME/.rustup-ci"
        fi
        rustup toolchain install stable --profile minimal --component rustfmt,clippy
        rustup default stable
        cargo -V
      fi
      cargo --version

      # The committed Swift bindings must be exactly what tools/uniffi/regen.sh generates now. First, so
      # stale bindings fail with a message that names them rather than as Swift errors further down.
      scripts/ci-check-bindings.sh
      scripts/swift-smoke.sh

      # The agent's host collector differs per platform; prove it reads a macOS host.
      cargo run -p pessimal_agent_host -- --config pessimal.example.toml --sample
      # The workspace tests on macOS too: the Linux step cannot see macOS-only code paths.
      cargo test --workspace --locked

      # The bundle last among the builds. build-macos-app.sh is the one cargo build here that sets
      # MACOSX_DEPLOYMENT_TARGET, and it fails loudly if its link picks up C objects compiled for a
      # newer macOS -- so every build for this guest's own target happens before it, and the target
      # changes once.
      scripts/build-macos-app.sh
      scripts/ci-check-macos-bundle.sh

  # ---------------------------------------------------------------------------
  # TestFlight. Every push to main that passes the three steps it depends on
  # ships to TestFlight. No tag, no button.
  #
  # It used to be gated on a `pessimal-ios-v*` tag behind a block step, which was
  # scaffolding from before the path had ever completed. Worse, it made the release
  # the *only* step a tag build ran -- the three it depends on are what a tag build skipped
  # -- so the signed upload depended on nothing having been verified. `depends_on`
  # below is the fix, and it is the real reason to do this rather than mere
  # convenience.
  #
  # This step never runs on a tag. `vMAJOR.MINOR.PATCH` tags release the agent
  # (the section after this one); `pessimal-ios-v*` tags stay unused, deliberately
  # left free for an App Store submission path, which is a different decision from
  # shipping to internal testers and should stay a deliberate act.
  # ---------------------------------------------------------------------------
  - label: ":rocket: iOS TestFlight"
    key: ios-testflight
    # Ship only what passed. All three, not just the iOS build: a release whose
    # workspace tests failed is a release that should not exist, and the macOS
    # bundle step is where swift-smoke.sh proves the FFI boundary still works.
    depends_on:
      - rust-linux
      - ios-simulator
      - macos-bundle
    # Trunk-based, so main is the only branch that ships. `build.tag == null` keeps
    # a tag push from shipping a duplicate of the build its commit already
    # produced. `[skip release]` in the commit message is the opt-out for a push
    # that cannot affect the app -- a docs typo, a CI tweak -- and it is a commit
    # message rather than a path filter on purpose: a path filter that is wrong
    # stops shipping silently, whereas a marker the author types is visible in the
    # log and fails towards shipping.
    # All three clauses were measured by one-clause probe steps on build #33, because
    # `broken_reason: conditional_failed` does not say which one was false. `build.branch == "main"`
    # and `build.pull_request.id == null` both evaluated TRUE — the latter despite `build.pull_request`
    # itself being null, so a field access on a null parent is fine here and was a red herring.
    #
    # What was false was a `build.message !~ /…/` clause that used to live here, and it was false for
    # a reason that had nothing to do with Buildkite: the commit introducing the opt-out marker
    # *documented the marker in its own message*, so the message genuinely contained it. See the skip
    # check in the command below for how that is now avoided.
    if: build.branch == "main" && build.tag == null && build.pull_request.id == null
    concurrency: 1
    concurrency_group: "big-cabbage/tart-ci-macos"
    agents:
      queue: "ci-macos-apple-silicon"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-macos-rust-bazel-ios-20260910-v2"
          os: "macos"
          always_pull: false
          headless: true
          # The Doppler service account token every Doppler read in this pipeline uses. This step reads
          # lightless-labs-pessimal / prd_ios_deployment.
          doppler_token_secret: DOPPLER_SERVICE_ACCOUNT_TOKEN
          # Only what is listed reaches the guest. An omission surfaces as a bare
          # "parameter not set" from the guest's shell under `set -u`, naming the variable but not the
          # reason, so keep this in step with what the command below actually reads.
          env:
            - BUILDKITE_BUILD_NUMBER
            - BUILDKITE_COMMIT
            - BUILDKITE_MESSAGE
    artifact_paths:
      - ".bazel/bin/clients/apple/ios/Pessimal.ipa"
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" ]]; then
        export HOME=/Users/admin
      fi

      shared_dir="$$(pwd)"
      work_dir="$$HOME/pessimal-release-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$shared_dir/" "$$work_dir/"
      cd "$$work_dir"

      : "$${BUILDKITE_BUILD_NUMBER:?not forwarded to the guest; add it to the plugin's env allowlist}"

      # The opt-out. The marker is honoured on the commit's SUBJECT LINE ONLY, and that restriction is
      # the whole point rather than a nicety.
      #
      # Builds 32 and 33 were both lost to the obvious version of this: a check against the full
      # message is tripped by any commit that *discusses* the marker, and the commit introducing it
      # necessarily did. #32 skipped through the step's `if`, #33 through this check, and #33 reported
      # success with no ipa -- the most expensive shape of failure, because it looks like a release.
      #
      # Reading only the first line means prose about the feature lives safely in the body, which is
      # where documentation belongs. It also has to be here rather than in the `if:` condition:
      # Buildkite's `build.message` is the whole message and cannot be narrowed to its first line.
      subject="$$(printf '%s\n' "$${BUILDKITE_MESSAGE:-}" | head -1)"
      if [[ "$$subject" == *"[skip release]"* ]]; then
        echo "subject line asks to skip the release; not shipping this push"
        echo "  subject: $$subject"
        exit 0
      fi

      # The marketing version comes from the workspace manifest, which is already the single source of
      # truth for every crate's version. One place to bump, and `cog bump` moves it.
      #
      # The build number is Buildkite's, which is monotonic for the life of the pipeline. App Store
      # Connect rejects a CFBundleVersion it has seen before under the same marketing version, so the
      # counter has to come from something that cannot go backwards -- not a commit count, not a date.
      version="$$(awk '/^\[workspace\.package\]/{f=1; next} /^\[/{f=0} f && /^version[[:space:]]*=/{gsub(/["[:space:]]/,"",$$0); sub(/^version=/,"",$$0); print; exit}' Cargo.toml)"
      if [[ ! "$$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$$ ]]; then
        echo "could not read a semver version from [workspace.package] in Cargo.toml (got '$$version')" >&2
        exit 1
      fi
      echo "shipping $$version ($$BUILDKITE_BUILD_NUMBER) from $${BUILDKITE_COMMIT:-unknown commit}"

      # The script reads the secrets over Doppler's REST API, unsets the service token, signs in a
      # temporary keychain, builds with Bazel and uploads with altool.
      scripts/release-ios-testflight-buildkite.sh "$$version" "$$BUILDKITE_BUILD_NUMBER"

      mkdir -p "$$shared_dir/.bazel/bin/clients/apple/ios"
      rsync -a ".bazel/bin/clients/apple/ios/Pessimal.ipa" \
        "$$shared_dir/.bazel/bin/clients/apple/ios/Pessimal.ipa"

  # ---------------------------------------------------------------------------
  # Cutting agent releases. After every CI step passes on main, release-cut runs
  # `cog bump --auto` in a fresh clone. If the commits since the last v* tag need
  # a new version, it pushes a version commit and the tag, and the tag build below
  # releases. Otherwise it does nothing. Nobody cuts a release by hand.
  # ---------------------------------------------------------------------------
  - label: ":scissors: Cut an agent release"
    key: release-cut
    if: build.branch == "main" && build.tag == null && build.pull_request.id == null
    depends_on:
      - rust-linux
      - otlp-export-smoke
      - ios-simulator
      - macos-bundle
    concurrency: 1
    concurrency_group: "pessimal/release-cut"
    agents:
      queue: "ci-linux-arm64"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-linux-arm64-rust-bazel"
          os: "linux"
          always_pull: false
          headless: true
          # Reads LL_CLI_RELEASE_GH_TOKEN from prd_macos_notarisation, to push the version commit and tag.
          doppler_token_secret: DOPPLER_SERVICE_ACCOUNT_TOKEN
          env:
            - BUILDKITE_COMMIT
            - BUILDKITE_MESSAGE
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" || "$$HOME" == "/" ]]; then
        export HOME=/home/admin
      fi

      subject="$$(printf '%s\n' "$${BUILDKITE_MESSAGE:-}" | head -1)"
      if [[ "$$subject" == *"[skip release]"* ]]; then
        echo "subject line asks to skip the release; not cutting one for this push"
        exit 0
      fi

      msrv="1.95"
      have="$$(cargo -V | awk '{print $$2}')"
      if [[ "$$(printf '%s\n%s\n' "$$msrv" "$$have" | sort -V | head -1)" != "$$msrv" ]]; then
        if [[ ! -w "$${RUSTUP_HOME:-$$HOME/.rustup}" ]]; then
          export RUSTUP_HOME="$$HOME/.rustup-ci"
        fi
        rustup toolchain install stable --profile minimal
        rustup default stable
      fi

      scripts/release-cut.sh

  # ---------------------------------------------------------------------------
  # The agent release. A `vMAJOR.MINOR.PATCH` tag runs these eight steps and
  # nothing else:
  #
  #   release-guard
  #     -> release-linux + (release-macos-build -> release-macos)
  #     -> release-publish
  #     -> release-verify-linux + release-verify-macos
  #     -> release-promote
  #
  # The tag comes from `cog bump`, which pushes main and then the tag, so it
  # starts two builds: main's ships the bump commit to TestFlight, the tag's
  # releases. Both want the single macOS slot, so release-macos-build usually
  # queues behind TestFlight. A long wait before it starts is that queue, not a hang.
  #
  # Forward only: draft, then prerelease, then latest. release-publish leaves a
  # prerelease, which /releases/latest does not point at; release-promote makes it
  # latest only after both verify steps have downloaded and run what GitHub
  # actually serves. Nothing here un-publishes. When a release goes wrong, a human
  # deletes the GitHub release and the tag and cuts it again
  # (docs/runbooks/cutting-a-release.md); release-publish reuses a draft an earlier
  # attempt left, so that is cheap.
  #
  # Credentials. release-macos, release-publish and release-promote use the
  # Doppler service account token, DOPPLER_SERVICE_ACCOUNT_TOKEN, to read
  # prd_macos_notarisation: the Apple signing secrets and LL_CLI_RELEASE_GH_TOKEN.
  # The guard, both builds and both verify steps hold no token.
  #
  # The macOS build and the macOS signing are separate steps, in separate guests.
  # A build runs code from every build.rs, and that code can read the token from
  # its parent's starting environment with `ps -E`; `export -n` does not clear it.
  # So the build step has no token, and the signing step runs nothing that was built.
  #
  # Files cross between steps only as Buildkite artifacts, and only on the host:
  # a guest holds no agent token, so it can neither upload nor download. A
  # producer rsyncs its finished assets back into the shared checkout for
  # `artifact_paths`, after its script has succeeded -- a script that fails never
  # reaches that line, so a failed attempt uploads nothing. The consumer lists the
  # artifacts plugin BEFORE tart-ci, so the plugin's pre-command hook has
  # downloaded into the checkout before tart-ci starts the guest on it. Measured on
  # this cluster on 2026-09-13: build #41 found an uploaded file inside the
  # consuming guest that way, and build #42, identical but without the plugin, did
  # not.
  #
  # Every release step lists BUILDKITE_TAG in the tart-ci env allowlist. The guest
  # sees only what is listed, and a script reading an empty tag cannot say why.
  #
  # The `if:` is Descartes' release condition character for character, single `$`
  # included, which is the form that pipeline releases with. It does not match
  # `pessimal-ios-v*`.
  #
  # No automatic retry on any of these, unlike the steps above. A release step
  # that exits non-zero is a check that said no, and the answer to that is a human
  # reading why; Buildkite's manual retry is there when the guest itself died.
  # ---------------------------------------------------------------------------
  - label: ":lock: Release guard"
    key: release-guard
    if: build.tag != null && build.tag =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    concurrency: 2
    concurrency_group: "big-cabbage/tart-ci-linux"
    agents:
      queue: "ci-linux-arm64"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-linux-arm64-rust-bazel"
          os: "linux"
          always_pull: false
          headless: true
          # BUILDKITE_COMMIT lets the guard refuse a tag that moved after this build started.
          env:
            - BUILDKITE_TAG
            - BUILDKITE_COMMIT
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" || "$$HOME" == "/" ]]; then
        export HOME=/home/admin
      fi

      work_dir="$$HOME/pessimal-release-guard-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$(pwd)/" "$$work_dir/"
      cd "$$work_dir"

      # Refuses, saying which, unless the tag's digits equal [workspace.package] version, the tagged
      # commit is on main, and no published release exists for the tag -- all asked of GitHub
      # anonymously. Nothing is built for a tag until this has passed.
      scripts/release-guard.sh

  - label: ":linux: Release: Linux agents"
    key: release-linux
    if: build.tag != null && build.tag =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    depends_on: release-guard
    concurrency: 2
    concurrency_group: "big-cabbage/tart-ci-linux"
    agents:
      queue: "ci-linux-arm64"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-linux-arm64-rust-bazel"
          os: "linux"
          always_pull: false
          headless: true
          env:
            - BUILDKITE_TAG
    artifact_paths:
      - ".build/release/dist/linux/*"
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" || "$$HOME" == "/" ]]; then
        export HOME=/home/admin
      fi

      shared_dir="$$(pwd)"
      work_dir="$$HOME/pessimal-release-linux-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$shared_dir/" "$$work_dir/"
      cd "$$work_dir"

      # cargo test, a pinned zig and cargo-zigbuild, both triples through zigbuild at glibc 2.28, the
      # floor checked on both, the aarch64 binary executed, both packaged. The output directory is
      # outside the checkout and fresh, because the script refuses one that is not empty.
      out_dir="$$HOME/pessimal-release-out"
      rm -rf "$$out_dir"
      scripts/release-build-linux.sh --out "$$out_dir"

      # Emptied first rather than synced over: rsync skips a file whose size and mtime match, so an
      # asset left from an earlier run could otherwise sit beside this run's .sha256.
      rm -rf "$$shared_dir/.build/release/dist/linux"
      mkdir -p "$$shared_dir/.build/release/dist/linux"
      rsync -a "$$out_dir/" "$$shared_dir/.build/release/dist/linux/"
      ls -l "$$shared_dir/.build/release/dist/linux"

  - label: ":apple: Release: build macOS agents and app"
    key: release-macos-build
    if: build.tag != null && build.tag =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    depends_on: release-guard
    # The single macOS slot every macOS job shares; see the iOS step for why it is one.
    concurrency: 1
    concurrency_group: "big-cabbage/tart-ci-macos"
    agents:
      queue: "ci-macos-apple-silicon"
    plugins:
      # No doppler_token_secret. This step runs every build.rs in the dependency graph, and a process can
      # read its parent's starting environment with `ps -E`, so the signing token must not be here.
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-macos-rust-bazel-ios-20260910-v2"
          os: "macos"
          always_pull: false
          headless: true
          env:
            - BUILDKITE_TAG
    artifact_paths:
      - ".build/release/unsigned/macos/*"
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" ]]; then
        export HOME=/Users/admin
      fi

      shared_dir="$$(pwd)"
      work_dir="$$HOME/pessimal-release-macos-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$shared_dir/" "$$work_dir/"
      cd "$$work_dir"

      # Builds both agent slices and Pessimal.app, runs them, and writes three unsigned tars.
      out_dir="$$HOME/pessimal-release-unsigned"
      rm -rf "$$out_dir"
      scripts/release-build-macos.sh --out "$$out_dir"

      rm -rf "$$shared_dir/.build/release/unsigned/macos"
      mkdir -p "$$shared_dir/.build/release/unsigned/macos"
      rsync -a "$$out_dir/" "$$shared_dir/.build/release/unsigned/macos/"
      ls -l "$$shared_dir/.build/release/unsigned/macos"

  - label: ":apple: Release: sign macOS agents and app"
    key: release-macos
    if: build.tag != null && build.tag =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    depends_on: release-macos-build
    concurrency: 1
    concurrency_group: "big-cabbage/tart-ci-macos"
    agents:
      queue: "ci-macos-apple-silicon"
    plugins:
      # BEFORE tart-ci, so the unsigned tars are in the checkout when the guest starts.
      - artifacts#v1.9.4:
          download:
            - ".build/release/unsigned/macos/*"
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-macos-rust-bazel-ios-20260910-v2"
          os: "macos"
          always_pull: false
          headless: true
          # Reads the Apple signing secrets from prd_macos_notarisation. Nothing built runs in this step.
          doppler_token_secret: DOPPLER_SERVICE_ACCOUNT_TOKEN
          env:
            - BUILDKITE_TAG
    artifact_paths:
      - ".build/release/dist/macos/*"
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" ]]; then
        export HOME=/Users/admin
      fi

      shared_dir="$$(pwd)"
      work_dir="$$HOME/pessimal-release-sign-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$shared_dir/" "$$work_dir/"
      cd "$$work_dir"

      tag="$${BUILDKITE_TAG:?not forwarded to the guest; add it to the tart-ci env allowlist}"

      # Signs, notarizes and staples, then packages. It builds nothing and runs nothing that was built.
      out_dir="$$HOME/pessimal-release-signed"
      rm -rf "$$out_dir"
      scripts/release-macos-artifacts.sh --version "$${tag#v}" \
        --in .build/release/unsigned/macos --out "$$out_dir"

      rm -rf "$$shared_dir/.build/release/dist/macos"
      mkdir -p "$$shared_dir/.build/release/dist/macos"
      rsync -a "$$out_dir/" "$$shared_dir/.build/release/dist/macos/"
      ls -l "$$shared_dir/.build/release/dist/macos"

  - label: ":package: Release: publish a prerelease"
    key: release-publish
    if: build.tag != null && build.tag =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    depends_on:
      - release-linux
      - release-macos
    concurrency: 2
    concurrency_group: "big-cabbage/tart-ci-linux"
    agents:
      queue: "ci-linux-arm64"
    plugins:
      # BEFORE tart-ci: this plugin's pre-command hook downloads both producers' assets into the
      # checkout, which is the only way files reach a guest. Whatever it downloads, release-github.py
      # publishes nothing unless the directory holds exactly the release's asset set, each beside the
      # .sha256 its producer wrote.
      - artifacts#v1.9.4:
          download:
            - ".build/release/dist/linux/*"
            - ".build/release/dist/macos/*"
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-linux-arm64-rust-bazel"
          os: "linux"
          always_pull: false
          headless: true
          # Reads LL_CLI_RELEASE_GH_TOKEN from prd_macos_notarisation.
          doppler_token_secret: DOPPLER_SERVICE_ACCOUNT_TOKEN
          # BUILDKITE_COMMIT lets publish refuse a tag that moved after this build started.
          env:
            - BUILDKITE_TAG
            - BUILDKITE_COMMIT
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" || "$$HOME" == "/" ]]; then
        export HOME=/home/admin
      fi

      # The publisher is Python, and the guest image's contents were never inventoried.
      if ! python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)' >/dev/null 2>&1; then
        echo "release-publish needs python3 3.9 or newer, and the ci-linux-arm64-rust-bazel guest has none that runs" >&2
        exit 1
      fi

      work_dir="$$HOME/pessimal-release-publish-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$(pwd)/" "$$work_dir/"
      cd "$$work_dir"

      # Draft (reused if an earlier attempt left one), upload, download every asset back and check it,
      # SHA256SUMS from the downloaded bytes, then a prerelease with make_latest "false".
      python3 scripts/release-github.py publish \
        --tag "$${BUILDKITE_TAG:?not forwarded to the guest; add it to the tart-ci env allowlist}" \
        --dist .build/release/dist

  - label: ":linux: Release: verify on Linux"
    key: release-verify-linux
    if: build.tag != null && build.tag =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    depends_on: release-publish
    concurrency: 2
    concurrency_group: "big-cabbage/tart-ci-linux"
    agents:
      queue: "ci-linux-arm64"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-linux-arm64-rust-bazel"
          os: "linux"
          always_pull: false
          headless: true
          env:
            - BUILDKITE_TAG
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" || "$$HOME" == "/" ]]; then
        export HOME=/home/admin
      fi

      work_dir="$$HOME/pessimal-release-verify-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$(pwd)/" "$$work_dir/"
      cd "$$work_dir"

      # Anonymous downloads from the public URLs, SHA256SUMS checked, the aarch64 Linux binary executed.
      # It holds no token and unsets any it finds. What this cluster cannot execute -- x86_64 Linux --
      # it says so, as SKIP, rather than counting it as passed.
      scripts/verify-release.sh "$${BUILDKITE_TAG:?not forwarded to the guest; add it to the tart-ci env allowlist}"

  - label: ":apple: Release: verify on macOS"
    key: release-verify-macos
    if: build.tag != null && build.tag =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    depends_on: release-publish
    concurrency: 1
    concurrency_group: "big-cabbage/tart-ci-macos"
    agents:
      queue: "ci-macos-apple-silicon"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-macos-rust-bazel-ios-20260910-v2"
          os: "macos"
          always_pull: false
          headless: true
          env:
            - BUILDKITE_TAG
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" ]]; then
        export HOME=/Users/admin
      fi

      work_dir="$$HOME/pessimal-release-verify-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$(pwd)/" "$$work_dir/"
      cd "$$work_dir"

      # The same anonymous checks from a guest that never saw the signing keychain: signatures,
      # Gatekeeper's notarisation verdict, the app's stapled ticket, and the arm64 agent executed.
      scripts/verify-release.sh "$${BUILDKITE_TAG:?not forwarded to the guest; add it to the tart-ci env allowlist}"

  - label: ":rocket: Release: promote to latest"
    key: release-promote
    if: build.tag != null && build.tag =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    depends_on:
      - release-verify-linux
      - release-verify-macos
    concurrency: 2
    concurrency_group: "big-cabbage/tart-ci-linux"
    agents:
      queue: "ci-linux-arm64"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-linux-arm64-rust-bazel"
          os: "linux"
          always_pull: false
          headless: true
          # Reads LL_CLI_RELEASE_GH_TOKEN from prd_macos_notarisation, like release-publish.
          doppler_token_secret: DOPPLER_SERVICE_ACCOUNT_TOKEN
          env:
            - BUILDKITE_TAG
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" || "$$HOME" == "/" ]]; then
        export HOME=/home/admin
      fi

      if ! python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)' >/dev/null 2>&1; then
        echo "release-promote needs python3 3.9 or newer, and the ci-linux-arm64-rust-bazel guest has none that runs" >&2
        exit 1
      fi

      work_dir="$$HOME/pessimal-release-promote-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$(pwd)/" "$$work_dir/"
      cd "$$work_dir"

      # prerelease -> latest. Then the Homebrew tap's Formula/pessimal-agent.rb, best-effort: by then the
      # release has shipped, so a tap failure prints the manual bump and does not redden this step.
      python3 scripts/release-github.py promote \
        --tag "$${BUILDKITE_TAG:?not forwarded to the guest; add it to the tart-ci env allowlist}"
