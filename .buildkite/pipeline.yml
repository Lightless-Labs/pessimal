# Pessimal on the self-hosted Apple silicon mini, through Tart guests.
#
# The shape is Descartes' (lightless-labs/public/descartes/.buildkite/pipeline.yml), because it is the
# one verified on this cluster: the same pinned tart-ci plugin, the same two images, the same
# concurrency groups, and the same rsync-into-the-guest checkout. The reasoning behind each of those
# is recorded in the band's cookbook,
# docs/solutions/ci-cd-patterns/2026-09-10-buildkite-self-hosted-ios-cicd-cookbook.md.
#
# GitHub Actions keeps the cross-platform matrix (Linux, macOS, Windows) and the collector smoke test,
# which hosted runners do for free on a public repo. Buildkite exists here for what hosted runners
# cannot do: build the iOS app and sign it.
#
# Every push to main that passes verification ships to TestFlight. There is no tag to cut and no
# button to press, which is the point -- a release that needs a human to remember it is a release that
# drifts behind main. `[skip release]` in the commit message opts a push out.

steps:
  - label: ":linux: Rust workspace"
    key: rust-linux
    retry:
      automatic:
        # A fresh Tart guest fetches every external archive, so an upstream 500 is routine.
        # Exit 1 covers the Bazel fetch failure; the rest are the guest dying under us.
        - exit_status: 1
          limit: 2
        - exit_status: -1  # agent lost, VM never came up
          limit: 2
        - exit_status: 255
          limit: 2
    # Linux guests are cheap and do not count against the macOS guest limit, so the Rust workspace
    # runs here and leaves the single macOS slot for Bazel and the Apple bundles.
    concurrency: 2
    concurrency_group: "big-cabbage/tart-ci-linux"
    agents:
      queue: "ci-linux-arm64"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-linux-arm64-rust-bazel"
          os: "linux"
          always_pull: false
          headless: true
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" || "$$HOME" == "/" ]]; then
        export HOME=/home/admin
      fi

      # Out of the shared mount before building. Cargo and Bazel both write heavily, and the mount is
      # the one resource every concurrent guest shares.
      work_dir="$$HOME/pessimal-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$(pwd)/" "$$work_dir/"
      cd "$$work_dir"

      # The guest images' default toolchain drifts behind this workspace's MSRV: the macOS image ships
      # rustc 1.88 and sysinfo requires 1.95. Bazel never notices, because MODULE.bazel pins its own
      # 1.95.0 toolchain, so only the cargo-driven steps see it -- which is why the iOS job passed
      # while the macOS bundle failed with a list of crates demanding 1.95.
      #
      # Gated on the measured version rather than installed unconditionally. The Linux guest's rustup
      # lives in a root-owned /opt/rustup that the job user cannot write to, so an unconditional
      # install fails there with EACCES -- and that image already ships a new enough toolchain, so the
      # gate means it is never attempted. `stable` rather than a pinned version, to match what
      # .github/workflows/ci.yml installs: the workspace tracks stable on purpose, and pinning here
      # would quietly stop CI testing what GitHub tests.
      msrv="1.95"
      have="$$(cargo -V | awk '{print $$2}')"
      echo "cargo reports $$have; MSRV is $$msrv"
      if [[ "$$(printf '%s\n%s\n' "$$msrv" "$$have" | sort -V | head -1)" != "$$msrv" ]]; then
        echo "the guest toolchain is behind MSRV; installing stable"
        if [[ ! -w "$${RUSTUP_HOME:-$$HOME/.rustup}" ]]; then
          export RUSTUP_HOME="$$HOME/.rustup-ci"
        fi
        rustup toolchain install stable --profile minimal --component rustfmt,clippy
        rustup default stable
        cargo -V
      fi
      cargo --version
      cargo fmt --all --check
      cargo clippy --workspace --all-targets -- -D warnings
      cargo test --workspace --locked

  - label: ":bazel: iOS app"
    key: ios-simulator
    retry:
      automatic:
        # A fresh Tart guest fetches every external archive, so an upstream 500 is routine.
        # Exit 1 covers the Bazel fetch failure; the rest are the guest dying under us.
        - exit_status: 1
          limit: 2
        - exit_status: -1  # agent lost, VM never came up
          limit: 2
        - exit_status: 255
          limit: 2
    # Exactly ONE macOS guest at a time, shared with every other macOS job. Two concurrent macOS VMs
    # starve each other on this host; Descartes' pipeline records the build numbers where that was
    # diagnosed. Do not raise this to get a faster pipeline.
    concurrency: 1
    concurrency_group: "big-cabbage/tart-ci-macos"
    agents:
      queue: "ci-macos-apple-silicon"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-macos-rust-bazel-ios-20260910-v2"
          os: "macos"
          always_pull: false
          headless: true
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" ]]; then
        export HOME=/Users/admin
      fi

      # Bazel on the shared mount fails on hardlinks. rsync sidesteps it by not making any.
      work_dir="$$HOME/pessimal-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$(pwd)/" "$$work_dir/"
      cd "$$work_dir"

      bazelisk build --config=ci //clients/apple/ios:Pessimal

      # A Swift app that compiled but never linked the Rust would still produce a runnable bundle and
      # fail at the first poll, so the symbols are the assertion, not the exit status.
      ipa=".bazel/bin/clients/apple/ios/Pessimal.ipa"
      test -f "$$ipa" || { echo "no ipa produced" >&2; exit 1; }
      unpack="$$(mktemp -d)"
      unzip -q "$$ipa" -d "$$unpack"
      bin="$$unpack/Payload/Pessimal.app/Pessimal"
      test -x "$$bin" || { echo "no executable in the bundle" >&2; exit 1; }
      symbols="$$(nm -gU "$$bin" | grep -c uniffi_pessimal_ffi || true)"
      echo "uniffi scaffolding symbols: $$symbols"
      if [[ "$$symbols" -lt 1 ]]; then
        echo "the iOS binary carries no uniffi symbols; the Rust core is not linked" >&2
        exit 1
      fi

  - label: ":apple: macOS menu bar app"
    key: macos-bundle
    retry:
      automatic:
        # A fresh Tart guest fetches every external archive, so an upstream 500 is routine.
        # Exit 1 covers the Bazel fetch failure; the rest are the guest dying under us.
        - exit_status: 1
          limit: 2
        - exit_status: -1  # agent lost, VM never came up
          limit: 2
        - exit_status: 255
          limit: 2
    depends_on: ios-simulator
    concurrency: 1
    concurrency_group: "big-cabbage/tart-ci-macos"
    agents:
      queue: "ci-macos-apple-silicon"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-macos-rust-bazel-ios-20260910-v2"
          os: "macos"
          always_pull: false
          headless: true
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" ]]; then
        export HOME=/Users/admin
      fi

      work_dir="$$HOME/pessimal-macos-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$(pwd)/" "$$work_dir/"
      cd "$$work_dir"

      # The guest images' default toolchain drifts behind this workspace's MSRV: the macOS image ships
      # rustc 1.88 and sysinfo requires 1.95. Bazel never notices, because MODULE.bazel pins its own
      # 1.95.0 toolchain, so only the cargo-driven steps see it -- which is why the iOS job passed
      # while the macOS bundle failed with a list of crates demanding 1.95.
      #
      # Gated on the measured version rather than installed unconditionally. The Linux guest's rustup
      # lives in a root-owned /opt/rustup that the job user cannot write to, so an unconditional
      # install fails there with EACCES -- and that image already ships a new enough toolchain, so the
      # gate means it is never attempted. `stable` rather than a pinned version, to match what
      # .github/workflows/ci.yml installs: the workspace tracks stable on purpose, and pinning here
      # would quietly stop CI testing what GitHub tests.
      msrv="1.95"
      have="$$(cargo -V | awk '{print $$2}')"
      echo "cargo reports $$have; MSRV is $$msrv"
      if [[ "$$(printf '%s\n%s\n' "$$msrv" "$$have" | sort -V | head -1)" != "$$msrv" ]]; then
        echo "the guest toolchain is behind MSRV; installing stable"
        if [[ ! -w "$${RUSTUP_HOME:-$$HOME/.rustup}" ]]; then
          export RUSTUP_HOME="$$HOME/.rustup-ci"
        fi
        rustup toolchain install stable --profile minimal --component rustfmt,clippy
        rustup default stable
        cargo -V
      fi
      cargo --version

      scripts/build-macos-app.sh
      scripts/swift-smoke.sh

  # ---------------------------------------------------------------------------
  # Release. Every push to main that passes the three steps above ships to
  # TestFlight. No tag, no button.
  #
  # It used to be gated on a `pessimal-ios-v*` tag behind a block step, which was
  # scaffolding from before the path had ever completed. Worse, it made the release
  # the *only* step a tag build ran -- the three above are what a tag build skipped
  # -- so the signed upload depended on nothing having been verified. `depends_on`
  # below is the fix, and it is the real reason to do this rather than mere
  # convenience.
  #
  # Tags are now unused here, and deliberately left free for an App Store
  # submission path, which is a different decision from shipping to internal
  # testers and should stay a deliberate act.
  # ---------------------------------------------------------------------------
  - label: ":rocket: iOS TestFlight"
    key: ios-testflight
    # Ship only what passed. All three, not just the iOS build: a release whose
    # workspace tests failed is a release that should not exist, and the macOS
    # bundle step is where swift-smoke.sh proves the FFI boundary still works.
    depends_on:
      - rust-linux
      - ios-simulator
      - macos-bundle
    # Trunk-based, so main is the only branch that ships. `build.tag == null` keeps
    # a tag push from shipping a duplicate of the build its commit already
    # produced. `[skip release]` in the commit message is the opt-out for a push
    # that cannot affect the app -- a docs typo, a CI tweak -- and it is a commit
    # message rather than a path filter on purpose: a path filter that is wrong
    # stops shipping silently, whereas a marker the author types is visible in the
    # log and fails towards shipping.
    # Cut down to the two constructs this cluster has actually run. Build #32 passed every
    # verification step and then reported `broken_reason: conditional_failed` on this one, with the API
    # showing `branch=main`, `tag=null` and `pull_request=null` — so something in the longer condition
    # it used to carry does not evaluate the way its English reads. The two suspects were
    # `build.pull_request.id` (a field access on a null parent) and `!~`, neither of which appears in
    # any sibling pipeline; the probe steps below isolate them. Until they answer, this gate uses only
    # what is known to work, because a release gate that silently never fires is worse than one that
    # fires too often.
    if: build.branch == "main" && build.tag == null
    concurrency: 1
    concurrency_group: "big-cabbage/tart-ci-macos"
    agents:
      queue: "ci-macos-apple-silicon"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-macos-rust-bazel-ios-20260910-v2"
          os: "macos"
          always_pull: false
          headless: true
          # Holds a Doppler service token for lightless-labs-pessimal / prd_ios_deployment. The lane
          # reads the secrets; the guest never sees the vault beyond this one config.
          doppler_token_secret: DOPPLER_PESSIMAL_PRD_IOS_DEPLOYMENT
          # Only what is listed reaches the guest. An omission surfaces as a bare
          # "parameter not set" from the guest's shell under `set -u`, naming the variable but not the
          # reason, so keep this in step with what the command below actually reads.
          env:
            - BUILDKITE_BUILD_NUMBER
            - BUILDKITE_COMMIT
            - BUILDKITE_MESSAGE
    artifact_paths:
      - ".bazel/bin/clients/apple/ios/Pessimal.ipa"
    command: |
      set -euo pipefail

      if [[ -z "$${HOME:-}" ]]; then
        export HOME=/Users/admin
      fi

      shared_dir="$$(pwd)"
      work_dir="$$HOME/pessimal-release-checkout"
      rm -rf "$$work_dir" && mkdir -p "$$work_dir"
      rsync -a --delete --exclude .git "$$shared_dir/" "$$work_dir/"
      cd "$$work_dir"

      : "$${BUILDKITE_BUILD_NUMBER:?not forwarded to the guest; add it to the plugin's env allowlist}"

      # The opt-out, checked here rather than in the step's `if`. It costs a guest boot to decline a
      # release, which is the thing the opt-out was meant to save -- but it is plain bash that can be
      # tested, and it prints why it declined. A condition that silently never fires is the failure
      # this whole step just had.
      if [[ "$${BUILDKITE_MESSAGE:-}" == *"[skip release]"* ]]; then
        echo "commit message carries [skip release]; not shipping this push"
        exit 0
      fi

      # The marketing version comes from the workspace manifest, which is already the single source of
      # truth for every crate's version. One place to bump, and `cog bump` moves it.
      #
      # The build number is Buildkite's, which is monotonic for the life of the pipeline. App Store
      # Connect rejects a CFBundleVersion it has seen before under the same marketing version, so the
      # counter has to come from something that cannot go backwards -- not a commit count, not a date.
      version="$$(awk '/^\[workspace\.package\]/{f=1; next} /^\[/{f=0} f && /^version[[:space:]]*=/{gsub(/["[:space:]]/,"",$$0); sub(/^version=/,"",$$0); print; exit}' Cargo.toml)"
      if [[ ! "$$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$$ ]]; then
        echo "could not read a semver version from [workspace.package] in Cargo.toml (got '$$version')" >&2
        exit 1
      fi
      echo "shipping $$version ($$BUILDKITE_BUILD_NUMBER) from $${BUILDKITE_COMMIT:-unknown commit}"

      # Ruby 3 is required: macOS ships 2.6, where bundler cannot even find fastlane.
      #
      # .ruby-version records what the development machine has, and rbenv treats that file as
      # authoritative -- it refuses to run at all when the named version is absent, which is how the
      # previous attempt died with "version `3.4.5' is not installed". RBENV_VERSION overrides it with
      # the newest 3.x the image actually carries. Compiling a Ruby per job to match a patch release
      # would cost several minutes to buy nothing.
      if command -v rbenv >/dev/null 2>&1; then
        export PATH="$$(rbenv root)/shims:$$PATH"
        installed="$$(rbenv versions --bare 2>/dev/null | grep '^3\.' | sort -V | tail -1 || true)"
        if [[ -n "$$installed" ]]; then
          export RBENV_VERSION="$$installed"
        fi
      fi

      # Homebrew's Ruby as a second chance, for an image carrying no rbenv 3.x at all.
      if ! ruby -e 'exit RUBY_VERSION.split(".").first.to_i >= 3' >/dev/null 2>&1; then
        for candidate in /opt/homebrew/opt/ruby/bin /usr/local/opt/ruby/bin; do
          if [[ -x "$$candidate/ruby" ]]; then
            export PATH="$$candidate:$$PATH"
            break
          fi
        done
      fi

      ruby_version="$$(ruby -e 'print RUBY_VERSION')"
      echo "ruby $$ruby_version"
      case "$$ruby_version" in
        3.*) ;;
        *) echo "fastlane needs Ruby 3; this guest offers only $$ruby_version" >&2; exit 1 ;;
      esac
      expected="$$(tr -d '[:space:]' < .ruby-version)"
      if [[ "$$ruby_version" != "$$expected" ]]; then
        echo "note: .ruby-version asks for $$expected; this guest has $$ruby_version"
      fi

      # The selected Ruby may have no bundler. --conservative leaves an existing one alone.
      gem install bundler --no-document --conservative
      bundle install --quiet

      # The Doppler service token the plugin injects opens the whole config, and there is no doppler
      # CLI on the guest. The script reads the handful of secrets the lane needs over the REST API,
      # unsets the token before fastlane starts, and is equally runnable by hand with the values
      # already in the environment.
      scripts/release-ios-testflight-buildkite.sh "$$version" "$$BUILDKITE_BUILD_NUMBER"

      mkdir -p "$$shared_dir/.bazel/bin/clients/apple/ios"
      rsync -a ".bazel/bin/clients/apple/ios/Pessimal.ipa" \
        "$$shared_dir/.bazel/bin/clients/apple/ios/Pessimal.ipa"

  # ---------------------------------------------------------------------------
  # TEMPORARY probes. Build #32's release step reported `conditional_failed` with
  # every field the condition reads looking correct, and Buildkite does not say
  # which clause was false. These isolate the two unproven constructs so the next
  # build answers it instead of the next guess.
  #
  # Linux queue, so they cost a cheap guest and run beside everything else. Delete
  # them, and this comment, once they have reported.
  # ---------------------------------------------------------------------------
  - label: ":mag: probe: branch == main"
    key: probe-branch
    if: build.branch == "main"
    concurrency: 2
    concurrency_group: "big-cabbage/tart-ci-linux"
    agents:
      queue: "ci-linux-arm64"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-linux-arm64-rust-bazel"
          os: "linux"
          always_pull: false
          headless: true
    command: echo 'build.branch == "main" evaluated true'

  - label: ":mag: probe: pull_request.id == null"
    key: probe-pr
    if: build.pull_request.id == null
    concurrency: 2
    concurrency_group: "big-cabbage/tart-ci-linux"
    agents:
      queue: "ci-linux-arm64"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-linux-arm64-rust-bazel"
          os: "linux"
          always_pull: false
          headless: true
    command: echo 'build.pull_request.id == null evaluated true'

  - label: ":mag: probe: message does not match"
    key: probe-message
    if: build.message !~ /\[skip release\]/
    concurrency: 2
    concurrency_group: "big-cabbage/tart-ci-linux"
    agents:
      queue: "ci-linux-arm64"
    plugins:
      - github.com/Lightless-Labs/tart-ci#v0.2.4:
          image: "ci-linux-arm64-rust-bazel"
          os: "linux"
          always_pull: false
          headless: true
    command: echo 'build.message !~ /[skip release]/ evaluated true'
