[package]
name = "pessimal_ffi"
description = "UniFFI bridge exposing pessimal_client_core to Swift. Translation only, no business logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# `staticlib` is what an iOS app links against; `cdylib` is what uniffi-bindgen reads to generate
# the Swift; `lib` is what this crate's own tests use.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
pessimal_client_core = { workspace = true }
pessimal_core = { workspace = true }
pessimal_query_signoz = { workspace = true }
pessimal_usage = { workspace = true }
pessimal_usage_otlp = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# The `tokio` feature is what makes `#[uniffi::export(async_runtime = "tokio")]` available. It is
# needed because reqwest wants a tokio reactor — nothing in pessimal_client_core does.
uniffi = { workspace = true, features = ["tokio"] }
tokio = { workspace = true }
thiserror = { workspace = true }
# Mirrors the adapter's choice; see pessimal_query_signoz/Cargo.toml for why ring + the platform
# verifier rather than native-tls or aws-lc-rs.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Not for serialising anything of this crate's own: `FleetConfigRecord` carries its rule set as a
# JSON array because `AlertRule`'s id is private with no setter, so `Deserialize` is the only
# construction path that keeps a rule the same rule. See `config_records`.
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
# The `testing` feature exists for exactly this — its own comment says so. A dev-dependency, so the
# doubles are not in the shipped staticlib.
pessimal_client_core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
